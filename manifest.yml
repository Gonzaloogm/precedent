app:
  id: ari:cloud:ecosystem::app/ee229f6b-ee7f-480c-8ac8-e6e2cbec7b51
  runtime:
    name: nodejs24.x
  # One installation (and one Rovo agent) that can also read Jira for the deja-vu check.
  compatibility:
    confluence:
      required: true
    jira:
      required: false

modules:
  rovo:agent:
    - key: market-research-agent
      name: SF Market Research
      description: >-
        Stress-tests the initiative proposal on the current Confluence page:
        ideal customer, market size, competitors, risks and a viability score,
        cross-checked against similar work your company has already done.
      prompt: resource:agent-resources;prompts/market-research.txt
      conversationStarters:
        - Stress-test the proposal on this page
        - Has our company already tried something like this?
        - Who exactly is the customer for this initiative?
      followUpPrompt: >-
        Suggest short next steps that keep the human in charge: challenge the weakest assumption
        in the report, ask for evidence behind a specific score, check the company's past work on
        a related topic, or save the report as a child page once the user is satisfied.
      actions:
        - get-proposal
        - find-related-initiatives
        - save-report

    - key: devils-advocate-agent
      name: SF Devil's Advocate
      description: >-
        Plays the funding committee: reads the proposal, the earlier SprintFounders reports and
        the team's comments, answers every objection and gives a go / pivot / kill verdict.
      prompt: resource:agent-resources;prompts/devils-advocate.txt
      conversationStarters:
        - Should we fund this initiative?
        - Answer the objections in the comments
        - What would make you kill this initiative?
      followUpPrompt: >-
        Suggest short next steps that keep the human in charge: push back on the verdict, add an
        objection as a page comment and re-run the review, explore one of the pivot options, or
        save the review as a child page once the user agrees.
      actions:
        - get-review-context
        - find-related-initiatives
        - save-report
        - list-jira-projects
        - create-jira-epic

  trigger:
    - key: comment-created
      function: commentCreated
      events:
        - avi:confluence:created:comment

  scheduledTrigger:
    - key: daily-gate-check
      function: gateCheck
      interval: day

  confluence:contentBylineItem:
    - key: committee-byline
      title: SprintFounders
      tooltip: Committee verdict for this proposal
      render: native
      resource: committee-ui
      viewportSize: medium
      contentPropertyKey: sprintfounders-byline-7f3c2a
      resolver:
        function: committeeResolver

  confluence:globalPage:
    - key: get-started
      title: SprintFounders
      route: get-started
      render: native
      resource: get-started-ui
      resolver:
        function: getStartedResolver

  action:
    - key: get-review-context
      name: Get review context
      function: getReviewContext
      actionVerb: GET
      description: >-
        Reads the proposal, the SprintFounders reports saved under it, and the team's open page
        comments (objections). Works from the proposal or from any of its reports. Call this first.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: false
          description: Proposal or report page ID. Leave empty to use the page the user is on.

    - key: list-jira-projects
      name: List Jira projects
      function: listJiraProjects
      actionVerb: GET
      description: >-
        Lists the Jira projects the user can see (key, name, type), so the user can choose where
        the initiative's epic should be created.
      inputs:
        query:
          title: Filter
          type: string
          required: false
          description: Not used yet; leave empty.

    - key: create-jira-epic
      name: Create Jira epic
      function: createJiraEpic
      actionVerb: CREATE
      description: >-
        Creates one epic with child stories in a Jira project, linked back to the proposal page.
        Only call this after the user has approved the epic draft and chosen the project.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: Key of the Jira project chosen by the user, e.g. SFD.
        epicSummary:
          title: Epic summary
          type: string
          required: true
          description: Short epic title.
        epicDescription:
          title: Epic description
          type: string
          required: true
          description: Goal, verdict and first milestone, as short paragraphs and "- " bullets.
        storiesList:
          title: Stories
          type: string
          required: true
          description: >-
            One story per line, as "- Summary | details". 3 to 8 stories.
        pageId:
          title: Page ID
          type: string
          required: false
          description: The proposal or review page ID. Leave empty to use the page the user is on.

    - key: get-proposal
      name: Get proposal
      function: getProposal
      actionVerb: GET
      description: >-
        Reads the initiative proposal from the current Confluence page (title
        and body as plain text). Call this first, before any analysis.
      inputs:
        pageId:
          title: Page ID
          type: string
          required: false
          description: Confluence page ID. Leave empty to use the page the user is on.

    - key: find-related-initiatives
      name: Find related initiatives
      function: findRelatedInitiatives
      actionVerb: GET
      description: >-
        Searches this site's Confluence pages and Jira issues for earlier
        initiatives, decisions or projects similar to the proposal. Returns
        titles, links, status and excerpts to cite.
      inputs:
        keywords:
          title: Keywords
          type: string
          required: true
          description: 3 to 6 distinctive keywords from the proposal, separated by spaces.
        pageId:
          title: Page ID
          type: string
          required: false
          description: The proposal page ID, so it is excluded from the results.

    - key: save-report
      name: Save report
      function: saveReport
      actionVerb: CREATE
      description: >-
        Saves the finished report as a child page of the proposal. Only call
        this after the user has reviewed the report and explicitly confirmed
        they want it saved.
      inputs:
        reportMarkdown:
          title: Report (Markdown)
          type: string
          required: true
          description: The full report in Markdown.
        reportTitle:
          title: Report title
          type: string
          required: true
          description: >-
            Short title starting with the report type, e.g. "Market Research - <proposal title>"
            or "Devil's Advocate Review - <proposal title>".
        pageId:
          title: Page ID
          type: string
          required: false
          description: The proposal page ID. Leave empty to use the page the user is on.
        verdict:
          title: Verdict
          type: string
          required: false
          description: Devil's Advocate only. GO, PIVOT or STOP.
        committeeScore:
          title: Committee score
          type: string
          required: false
          description: Devil's Advocate only. Total score out of 100.
        axisScores:
          title: Axis scores
          type: string
          required: false
          description: Devil's Advocate only. "Axis=score" pairs separated by ";", each out of 25.
        objectionRulings:
          title: Objection rulings
          type: string
          required: false
          description: Devil's Advocate only. One line per objection, "- upheld | summary".
        stageGates:
          title: Stage gates
          type: string
          required: false
          description: Devil's Advocate only. One line per gate, "- 30 | measurable signal".

  function:
    - key: getProposal
      handler: index.getProposal
    - key: findRelatedInitiatives
      handler: index.findRelatedInitiatives
    - key: saveReport
      handler: index.saveReport
    - key: getReviewContext
      handler: index.getReviewContext
    - key: listJiraProjects
      handler: index.listJiraProjects
    - key: createJiraEpic
      handler: index.createJiraEpic
    - key: getStartedResolver
      handler: getStarted.handler
    - key: committeeResolver
      handler: committee.handler
    - key: gateCheck
      handler: gateCheck.run
    - key: commentCreated
      handler: commentEvents.onComment

resources:
  - key: agent-resources
    path: resource/agent
  - key: get-started-ui
    path: src/frontend/getStarted.jsx
  - key: committee-ui
    path: src/frontend/committee.jsx

permissions:
  scopes:
    - read:page:confluence
    - write:page:confluence
    - read:comment:confluence
    - write:comment:confluence
    - read:space:confluence
    - write:space:confluence
    - search:confluence
    - read:confluence-content.summary
    - read:jira-work
    - write:jira-work
